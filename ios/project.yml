name: Alfred
options:
  bundleIdPrefix: org.zyco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Alfred:
    type: application
    platform: iOS
    sources:
      - path: Alfred
    entitlements:
      path: Support/Alfred.entitlements
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Alfred
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - remote-notification
        CFBundleDocumentTypes:
          - CFBundleTypeName: PKCS12 certificate
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.rsa.pkcs-12
          - CFBundleTypeName: Any file
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
              - public.data
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Alfred connects to your alfredd server over your private network.
        NSPhotoLibraryUsageDescription: Attach photos to your conversation with Alfred.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zyco.alfred
        PRODUCT_NAME: Alfred
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  Alfred:
    build:
      targets:
        Alfred: all
    run:
      config: Debug
    archive:
      config: Release
