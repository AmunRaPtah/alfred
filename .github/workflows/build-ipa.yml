name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel  # arm64 macos-latest pool kept timing out unacquired (2026-10-28, see Helm's workflow)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned (device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Alfred.xcodeproj \
            -scheme Alfred \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E 'error:|warning: .*deprecated|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"

      - name: Show compile errors
        if: failure()
        run: grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -100 || true

      - name: Package .app into .ipa
        env:
          ALFRED_URL: https://alfred.178-18-250-254.sslip.io
          ALFRED_TOKEN: ${{ secrets.ALFRED_TOKEN }}
          ALFRED_P12_B64: ${{ secrets.ALFRED_P12_B64 }}
          ALFRED_P12_PASS: ${{ secrets.ALFRED_P12_PASS }}
        run: |
          cd "$RUNNER_TEMP"
          APP=$(find dd/Build/Products -maxdepth 2 -name 'Alfred.app' -path '*Release-iphoneos*' | head -1)
          test -n "$APP" || { echo "No .app found"; find dd/Build/Products -name '*.app'; exit 1; }
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          # Private build: provision URL, token and mTLS cert from repo secrets.
          # Such an IPA carries a private key, so it is never published (see below).
          if [ -n "$ALFRED_P12_B64" ]; then
            python3 -c 'import json,os; json.dump({"url":os.environ["ALFRED_URL"],"token":os.environ["ALFRED_TOKEN"],"p12_b64":os.environ["ALFRED_P12_B64"],"p12_pass":os.environ["ALFRED_P12_PASS"]}, open("Payload/Alfred.app/embedded.json","w"))'
            echo "PRIVATE_BUILD=1" >> "$GITHUB_ENV"
            echo "Embedded private config"
          fi
          zip -qry Alfred.ipa Payload
          ls -lh Alfred.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Alfred-ipa
          path: ${{ runner.temp }}/Alfred.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Publish release "latest"
        if: env.PRIVATE_BUILD != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned build of ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ)). Sideload with SideStore or AltStore."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/Alfred.ipa" \
            --target "$GITHUB_SHA" \
            --title "Alfred (latest)" \
            --notes "$NOTES" \
            --latest
